name: Probe

on:
  push:
    branches: [ 'claude/**' ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Paper API versions
        run: |
          curl -s https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml \
            | grep -oP '(?<=<version>)[^<]+' | tail -25
      - name: PlaceholderAPI versions
        run: |
          curl -s https://repo.extendedclip.com/releases/me/clip/placeholderapi/maven-metadata.xml \
            | grep -oP '(?<=<version>)[^<]+' | tail -10
