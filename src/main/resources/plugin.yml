name: ${project.name}
version: ${project.version}
main: com.faboit.friendsystem.FriendSystemPlugin
api-version: '26.2'
folia-supported: true
description: ${project.description}
authors: [ faboit1 ]
softdepend: [ PlaceholderAPI ]

# Downloaded once by Paper's library loader and cached in the server's `libraries/`
# folder. Only the driver matching `storage.type` is ever used at runtime.
libraries:
  - com.zaxxer:HikariCP:7.1.0
  - org.xerial:sqlite-jdbc:3.53.2.1
  - org.mariadb.jdbc:mariadb-java-client:3.5.10
  - com.mysql:mysql-connector-j:9.7.0

commands:
  friends:
    description: Open your friends list, or run a quick action.
    aliases: [ friend, fr ]
    usage: /friends [add|remove|block|unblock|accept|deny|requests|blocked] [name]
    permission: friendsystem.use
  message:
    description: Message any player.
    aliases: [ dm, msg, whisper, w ]
    usage: /message <player> [message]
    permission: friendsystem.use
  reply:
    description: Reply to your most recent direct message.
    aliases: [ r ]
    usage: /reply [message]
    permission: friendsystem.use
  fsopen:
    description: (internal) Open a friend page from a clickable card.
    usage: /fsopen <uuid>
    permission: friendsystem.use
  friendsettings:
    description: Show all of your friend-system preferences and how to change them.
    aliases: [ friendsetting, fsettings ]
    usage: /friendsettings
    permission: friendsystem.use
  friendlistview:
    description: Show your friends list as buttons or as head cards.
    aliases: [ setfriendlistview ]
    usage: /friendlistview <buttons|cards>
    permission: friendsystem.use
  showfriendtoasts:
    description: Turn friend-system toast popups on or off.
    aliases: [ friendtoasts ]
    usage: /showfriendtoasts [on|off]
    permission: friendsystem.use
  friendsounds:
    description: Turn friend-system sound effects on or off.
    aliases: [ showfriendsounds ]
    usage: /friendsounds [on|off]
    permission: friendsystem.use
  friendactionbar:
    description: Turn friend-system action-bar notifications on or off.
    aliases: [ showfriendactionbar ]
    usage: /friendactionbar [on|off]
    permission: friendsystem.use
  friendreminders:
    description: Turn the periodic unread-message reminder on or off.
    aliases: [ friendreminder, showfriendreminders ]
    usage: /friendreminders [on|off]
    permission: friendsystem.use
  whocanmessageme:
    description: Choose who is allowed to send you direct messages.
    aliases: [ friendprivacy, setfriendprivacy ]
    usage: /whocanmessageme <everyone|friendsoffriends|friends|nobody>
    permission: friendsystem.use
  setfriendguiscale:
    description: Match the friends GUI paging to your client's GUI scale.
    aliases: [ friendguiscale ]
    usage: /setfriendguiscale <1-4>
    permission: friendsystem.use
  setfriendcolor:
    description: Set the colour your direct messages are shown in.
    aliases: [ setfriendcolour, friendcolor, friendcolour ]
    usage: /setfriendcolor <colour>
    permission: friendsystem.use

permissions:
  friendsystem.use:
    description: Access to the friends menu and messaging commands.
    default: true
  friendsystem.mod:
    description: Bypass direct-message privacy settings.
    default: op
  friendsystem.owner:
    description: Bypass direct-message privacy settings.
    default: op
  friendsystem.color.*:
    description: Use every chat colour for direct messages.
    default: op
